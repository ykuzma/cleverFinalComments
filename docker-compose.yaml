version: "3.9"

networks:
  news:
    driver: bridge
    external: true

services:
  ##2
  comments:
    container_name: comment_api
    image: comment_api
    build:
      context: ./comment-api
      dockerfile: Dockerfile
    environment:
      PORT: 8081
      server_port: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres1:5432/clever
    ports:
      - 8081:8081
    depends_on:
      - postgres1
    networks:
      - news

  postgres1:
    container_name: postgres1
    image: postgres:13.3
    ports:
      - "30000:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: clever
    networks:
      - news

